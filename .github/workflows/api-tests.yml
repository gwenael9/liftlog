name: API Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"

defaults:
  run:
    working-directory: api

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm test

  e2e-tests:
    name: Integration tests (e2e)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liftlog
          POSTGRES_PASSWORD: liftlog_password
          POSTGRES_DB: liftlog_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liftlog -d liftlog_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: liftlog
      DATABASE_PASSWORD: liftlog_password
      DATABASE_NAME: liftlog_db
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run test:e2e
